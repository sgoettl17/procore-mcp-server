name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build & manifest invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build from committed catalog artifacts; specs/ stays gitignored.
      - name: Build TypeScript and validate catalog
        run: npm run build

      - name: Verify tools manifest invariants
        run: npm test
